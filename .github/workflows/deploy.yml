name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: root
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          script: |
            cd /root/propnex-voice-web
            git pull origin main
            
            # Write the .env file using Secrets from GitHub
            echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}" > .env.local
            echo "APPS_SCRIPT_WEBHOOK_URL=${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}" >> .env.local
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env.local
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env.local
            echo "REDIS_URL=${{ secrets.REDIS_URL }}" >> .env.local

            npm install
            npm run build
            pm2 restart propnexai-frontend --update-env
